name: Normalize primary domain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace all public domains
        shell: bash
        run: |
          set -e
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            ! -path './.github/workflows/normalize-domain.yml' \
            \( -name '*.html' -o -name '*.xml' -o -name '*.json' -o -name '*.js' -o -name '*.mjs' -o -name '*.txt' -o -name '*.webmanifest' -o -name '*.css' \) \
            -print0 | while IFS= read -r -d '' f; do
              sed -i -E \
                -e 's#https?://(www\\.)?alkodastavka\\.vercel\\.app#https://alko-dostavka24.vercel.app#g' \
                -e 's#https?://(www\\.)?alkodostavka24\\.online#https://alko-dostavka24.vercel.app#g' \
                -e 's#https?://dostavka-alkogolya-24\\.vercel\\.app#https://alko-dostavka24.vercel.app#g' \
                -e 's#(www\\.)?alkodastavka\\.vercel\\.app#alko-dostavka24.vercel.app#g' \
                -e 's#(www\\.)?alkodostavka24\\.online#alko-dostavka24.vercel.app#g' \
                -e 's#dostavka-alkogolya-24\\.vercel\\.app#alko-dostavka24.vercel.app#g' \
                "$f"
            done
      - name: Remove redirect-only host logic from middleware
        shell: bash
        run: |
          test -f middleware.js
          if grep -qE 'alkodastavka\\.vercel\\.app|alkodostavka24\\.online' middleware.js; then
            echo 'Old host reference remains in middleware.js; failing instead of silently leaving a redirect.'
            exit 1
          fi
      - name: Commit normalized files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Set alko-dostavka24.vercel.app as the only public domain'
            git push
          fi
      - name: Remove this one-time workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/normalize-domain.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time domain normalization workflow' || true
          git push || true
