name: Normalize primary domain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy public URLs
        shell: bash
        run: |
          set -euo pipefail
          files=$(git grep -Il -e 'alkodastavka.vercel.app' -e 'alkodostavka24.online' -e 'www.alkodostavka24.online' -e 'dostavka-alkogolya-24.vercel.app' -- ':!middleware.js' ':!vercel.json' ':!.github/workflows/normalize-primary-domain.yml' || true)
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              sed -i \
                -e 's#https\?://alkodastavka\.vercel\.app#https://alkodostavka24.vercel.app#g' \
                -e 's#https\?://www\.alkodostavka24\.online#https://alkodostavka24.vercel.app#g' \
                -e 's#https\?://alkodostavka24\.online#https://alkodostavka24.vercel.app#g' \
                -e 's#https\?://dostavka-alkogolya-24\.vercel\.app#https://alkodostavka24.vercel.app#g' \
                "$file"
            done <<< "$files"
          fi
      - name: Commit normalized files and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/normalize-primary-domain.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: normalize all public URLs to primary domain'
          git push
