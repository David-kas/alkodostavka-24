name: Normalize primary domain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize domain and contacts
        run: node scripts/fix-site-seo.mjs

      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Normalize all site files to alko-dostavka24.vercel.app"
          git push
