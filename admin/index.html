<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Админ-панель — АЛКОдоставка</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="env-banner" class="env-banner" hidden></div>

  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <h1>Админ-панель</h1>
      <p class="login-hint">Управление каталогом: цены, фото, наличие</p>
      <p class="login-hint login-hint--accent">Для сохранения локально: <code>npm run dev</code> → <a href="http://127.0.0.1:3000/admin/">127.0.0.1:3000/admin/</a></p>
      <label class="field">
        <span>Пароль</span>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary">Войти</button>
      <p id="login-error" class="error-msg" hidden></p>
    </form>
  </div>

  <div id="admin-app" class="admin-app" hidden>
    <header class="admin-header">
      <div class="admin-header-inner">
        <h1>Каталог товаров</h1>
        <div class="admin-header-actions">
          <span id="product-count" class="badge">0 товаров</span>
          <button type="button" id="btn-add" class="btn btn-primary">+ Добавить товар</button>
          <button type="button" id="btn-save" class="btn btn-success">Сохранить на сайт</button>
          <button type="button" id="btn-export" class="btn btn-ghost" title="Скачать JSON на случай ошибки сохранения">Скачать JSON</button>
          <button type="button" id="btn-logout" class="btn btn-ghost">Выйти</button>
        </div>
      </div>
    </header>

    <div class="admin-toolbar">
      <input type="search" id="search" placeholder="Поиск по названию…" class="search-input">
      <select id="filter-category" class="select-input">
        <option value="all">Все категории</option>
        <option value="strong">Крепкий алкоголь</option>
        <option value="wine">Вино и игристое</option>
        <option value="beer">Пиво</option>
        <option value="snacks">Закуски</option>
      </select>
      <label class="checkbox-label">
        <input type="checkbox" id="filter-outstock"> Только «нет в наличии»
      </label>
    </div>

    <p id="status-msg" class="status-msg" role="status" aria-live="polite"></p>

    <div class="admin-layout">
      <div class="product-table-wrap">
        <table class="product-table">
          <thead>
            <tr>
              <th>Фото</th>
              <th>Название</th>
              <th>Категория</th>
              <th>Цена</th>
              <th>Наличие</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="product-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="edit-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-labelledby="modal-title">
      <button type="button" class="modal-close" data-close-modal aria-label="Закрыть">×</button>
      <h2 id="modal-title">Редактировать товар</h2>
      <form id="edit-form" class="edit-form">
        <input type="hidden" id="edit-id">
        <label class="field">
          <span>Название *</span>
          <input type="text" id="edit-name" required>
        </label>
        <label class="field">
          <span>Категория</span>
          <select id="edit-category">
            <option value="strong">Крепкий алкоголь</option>
            <option value="wine">Вино и игристое</option>
            <option value="beer">Пиво</option>
            <option value="snacks">Закуски</option>
          </select>
        </label>
        <label class="field">
          <span>Цена (₽) *</span>
          <input type="number" id="edit-price" min="0" step="1" required>
        </label>
        <label class="field">
          <span>Описание</span>
          <input type="text" id="edit-desc" placeholder="Объём 0.7 л. Доставка по Москве 24/7.">
        </label>
        <label class="field">
          <span>Alt для SEO</span>
          <input type="text" id="edit-alt">
        </label>
        <label class="field">
          <span>Путь к изображению</span>
          <input type="text" id="edit-image" placeholder="images/bottle.jpg">
        </label>
        <div class="field">
          <span>Загрузить фото</span>
          <input type="file" id="edit-upload" accept="image/jpeg,image/png,image/webp,image/gif">
        </div>
        <div class="preview-wrap">
          <img id="edit-preview" alt="" class="preview-img">
        </div>
        <label class="checkbox-label stock-toggle">
          <input type="checkbox" id="edit-instock" checked>
          В наличии (снять — покажется «Нет в наличии»)
        </label>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">Применить</button>
          <button type="button" class="btn btn-ghost" data-close-modal>Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/admin.js" defer></script>
</body>
</html>
